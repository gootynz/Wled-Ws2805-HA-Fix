    max: 10
    step: 1
    unit_of_measurement: min
  auto_lights_off_off_delay:
    name: "Delay before turning OFF (mins)"
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    unit_of_measurement: min
  auto_lights_off_transition:
    name: "Light transition speed (secs)"
    icon: mdi:transition
    min: 0
    max: 10
    step: 1
    unit_of_measurement: s
