type: grid
square: false
columns: 1
cards:
  - type: custom:tabbed-card
    options:
      defaultTabIndex: 0
    tabs:
      - card:
          type: grid
          square: false
          columns: 1
          cards:
            - type: custom:stack-in-card
              mode: vertical
              cards:
                - type: grid
                  square: false
                  columns: 1
                  cards:
                    - type: grid
                      square: false
                      columns: 1
                      cards:
                        - type: custom:auto-entities
                          card:
                            type: entities
                            title: Automatic Lights On Sunet
                            show_header_toggle: false
                            state_color: true
                          filter:
                            include:
                              - entity_id: "*auto_lights_off*"
                                options:
                                  secondary_info: last-changed
                            exclude:
                              - entity_id: >-
                                  automation.auto_lights_outdoor_lights_auto_lux_control
                          sort:
                            method: entity_id
                            reverse: false
                            numeric: true
                            ip: false
                            ignore_case: true
        attributes:
          label: AUTO SUNSET SINRISE LIGHTS
