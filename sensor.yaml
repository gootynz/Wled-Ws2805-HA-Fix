
- sensor:
    - name: "Auto Lights Off Lux Value"
      unique_id: auto_lights_off_lux_value
      unit_of_measurement: lx
      device_class: illuminance
      state: >
        {% set sensors = [
          states('sensor.red_motion_zb_illuminance'),
          states('sensor.green_motion_zb_illuminance'),
          states('sensor.blue_motion_zb_illuminance'),
          states('sensor.cyan_motion_zb_illuminance'),
          states('sensor.magenta_motion_zb_illuminance')
        ] %}
        {% set values = sensors | reject('in', ['unavailable','unknown','none']) | map('float', -1) | select('>=', 0) | list %}
        {{ (values | average(0)) | round(1) if values else 0 }}